<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小小郵差中文字車手｜清晰音效版</title>
<style>
:root{--blue:#2379bd;--ink:#173b59}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Arial Rounded MT Bold","Noto Sans TC",sans-serif;color:var(--ink)}body{background:linear-gradient(#8fddff 0 28%,#72c96b 28%)}.wrap{width:min(100% - 24px,760px);margin:auto;padding:14px 0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{margin:0;color:#fff;text-shadow:3px 3px #2872a0;font-size:clamp(25px,6vw,42px)}.stats{display:flex;gap:6px;flex-wrap:wrap}.pill,.panel{background:#fff;border:3px solid var(--blue);border-radius:16px;padding:7px 10px;font-weight:bold}.levelButton{cursor:pointer}.question{margin:12px auto 8px;text-align:center;background:#fff;border:4px solid var(--blue);border-radius:18px;padding:10px;font-size:clamp(19px,4vw,25px);font-weight:bold}.game{position:relative;width:100%;height:min(690px,calc(100vh - 235px));min-height:530px;overflow:hidden;border:7px solid #fff;border-radius:25px;background:#6dc766;box-shadow:0 7px #33854a}.road{position:absolute;inset:0 10%;background:#444;border-left:9px dashed #eee;border-right:9px dashed #eee;overflow:hidden;transition:background .5s}.road:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 68px,rgba(255,255,255,.55) 68px 77px,transparent 77px 145px);animation:roadMove var(--road-speed,1.3s) linear infinite}@keyframes roadMove{to{transform:translateY(145px)}}.road.dirt{background:#a96f3d;border-color:#f2ca75}.road.ice{background:#69b9d6;border-color:#e7fbff}.road.neon{background:#272452;border-color:#ff73d1}.road.grass{background:#3c9d51;border-color:#d9f56a}.road.dirt:before{background:repeating-linear-gradient(to bottom,transparent 0 78px,rgba(75,42,20,.5) 78px 86px,transparent 86px 155px)}.road.ice:before{background:repeating-linear-gradient(130deg,transparent 0 85px,rgba(255,255,255,.8) 85px 92px,transparent 92px 165px)}.road.neon:before{background:repeating-linear-gradient(to bottom,transparent 0 58px,#6cf7ff 58px 66px,transparent 66px 128px);filter:drop-shadow(0 0 8px #6cf7ff)}.road.grass:before{background:repeating-linear-gradient(to bottom,transparent 0 95px,#d9f56a 95px 103px,transparent 103px 190px)}.word{position:absolute;transform:translateX(-50%);min-width:100px;text-align:center;background:#fff;border:4px solid #f5b400;border-radius:18px;padding:8px 11px;font-size:clamp(25px,6vw,37px);font-weight:bold;color:#d43b48;z-index:3;box-shadow:0 5px #b78100;white-space:nowrap}.word.hint{animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:translateX(-50%) scale(1.13);background:#fff5a4}}.word.correct{border-color:#27b85a;background:#d9ffdf}.word.wrong{border-color:#e54646;background:#ffe0e0}.car{position:absolute;bottom:24px;transform:translateX(-50%);width:88px;height:122px;z-index:4;transition:left .18s ease}.body{position:absolute;inset:18px 4px 10px;background:#ef4054;border:4px solid #a51f35;border-radius:25px 25px 15px 15px}.window{position:absolute;top:25px;left:22px;width:44px;height:32px;background:#9ce7ff;border:4px solid #a51f35;border-radius:11px 11px 5px 5px}.wheel{position:absolute;top:42px;width:18px;height:34px;background:#222;border-radius:10px;z-index:-1}.wheel.l{left:-5px}.wheel.r{right:-5px}.flame{position:absolute;bottom:-10px;left:33px;width:23px;height:28px;background:#ffb21e;border-radius:50%;animation:flame .16s infinite alternate}.fast .flame{height:45px;background:#ff3d22}@keyframes flame{to{height:36px;background:#ff6b22}}.starRack{position:absolute;top:8px;left:50%;transform:translateX(-50%);min-height:46px;display:flex;gap:4px;align-items:center;z-index:7;background:#ffffffaa;border-radius:18px;padding:4px 8px}.star{font-size:31px;display:inline-block}.star.new{animation:starFly .9s ease}@keyframes starFly{0%{transform:translateY(80px) scale(.2);opacity:0}55%{transform:translateY(-7px) scale(1.35);opacity:1}100%{transform:translateY(0) scale(1)}}.speedBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:13px;width:54%;background:#172a3d;border-radius:9px;border:2px solid #fff;z-index:12}.speedFill{height:100%;width:0;background:linear-gradient(90deg,#38d66b,#ffd34d,#ff542f);border-radius:7px;transition:width .12s}.flash{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,10vw,65px);font-weight:bold;color:#fff;text-shadow:3px 3px #a51f35;opacity:0;z-index:8;pointer-events:none}.flash.show{animation:pop .75s ease}@keyframes pop{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1)}}.sideControls{position:absolute;inset:0;z-index:10;pointer-events:none}.sideButton{position:absolute;top:50%;transform:translateY(-50%);width:62px;height:96px;border:0;border-radius:18px;color:#fff;font-size:29px;font-weight:bold;cursor:pointer;pointer-events:auto;touch-action:manipulation;opacity:.92;box-shadow:0 5px #18528d}.sideButton:active{transform:translateY(calc(-50% + 4px));box-shadow:0 1px #18528d}.sideButton.left{left:10px;background:#ee8825;box-shadow:0 5px #9c5108}.sideButton.right{right:10px;background:#2fa45c;box-shadow:0 5px #1c6c3c}.below{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.panel{text-align:center;font-size:16px;min-width:235px}.panel button,.menu button{border:0;border-radius:12px;padding:8px 12px;color:#fff;background:#f19a24;font-weight:bold;cursor:pointer}.help{text-align:center;font-size:15px;margin:9px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.box{max-width:460px;background:#fff;border:5px solid var(--blue);border-radius:22px;padding:22px;text-align:center}.box h2{margin:0 0 10px}.box button{margin-top:10px;background:#287ed0;border:0;border-radius:12px;padding:11px 17px;color:#fff;font-weight:bold;font-size:17px}.menu{position:fixed;top:68px;right:16px;display:none;z-index:30;background:#fff;border:4px solid var(--blue);border-radius:16px;padding:12px;box-shadow:0 5px 15px #0004}.menu.show{display:block}.menu button{display:block;width:100%;margin:5px 0;font-size:16px;background:#287ed0}.motionStatus{font-size:14px;margin-top:8px;color:#2672a5}@media (orientation:portrait) and (min-width:600px){.wrap{width:min(100% - 32px,760px)}.game{height:720px}.road{inset:0 12%}.car{bottom:30px}}@media(max-width:480px){.sideButton{width:52px;height:82px;font-size:24px}.sideButton.left{left:6px}.sideButton.right{right:6px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📮 小小郵差中文字車手</h1><div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">❤️ <span id="lives">10</span></div><button class="pill levelButton" id="levelButton">關卡 <span id="level">1</span> ▾</button></div></header>
<div class="question" id="question">任務：讓車子撞上「每天」！</div>
<div class="game" id="game"><div class="road" id="road"></div><div class="starRack" id="starRack"></div><div class="word" data-index="0"></div><div class="word" data-index="1"></div><div class="word" data-index="2"></div><div class="car" id="car"><div class="flame"></div><div class="wheel l"></div><div class="wheel r"></div><div class="body"></div><div class="window"></div></div><div class="speedBar"><div class="speedFill" id="speedFill"></div></div><div class="sideControls"><button class="sideButton left" id="left">◀</button><button class="sideButton right" id="right">▶</button><button class="sideButton" id="boost" style="left:50%;top:auto;bottom:30px;transform:translateX(-50%);width:78px;height:58px;background:#e33b39;box-shadow:0 5px #8e2020">⬆️</button></div><div class="flash" id="flash"></div></div>
<div class="below"><div class="panel">🏆 連續答對：<span id="combo">0</span>　最佳：<span id="best">0</span></div><div class="panel">🌈 路面：<button id="roadBtn">更換路面</button><div id="motionStatus" class="motionStatus">Motion Control：未啟用</div></div><div class="panel">🎨 車庫：<button id="garage">更換車色</button></div></div><p class="help">你是小郵差！把正確中文字信件送到學校。</p>
</div>
<div class="menu" id="menu"><button id="restartMenu">重新開始</button></div>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">🎉 完成任務！</h2><p id="result"></p><button id="close">繼續挑戰</button></div></div>
<script>
'use strict';
const words=[['每天','每一天'],['自己','自己的自己'],['長大','長大的長大'],['已經','已經完成的已經'],['年級','班級的年級'],['上學','上學的上學'],['小學生','小學生的小學生'],['學校','學校的學校'],['裹','包裹的裹'],['老師','老師的老師'],['有','有沒有的有'],['同學','同學的同學'],['快樂','快樂的快樂'],['真','真的真']];
const roads=['','dirt','ice','neon','grass'],cars=['#ef4054','#287ed0','#7c55c7','#f19a24','#28a568'];const $=id=>document.getElementById(id),cards=[...document.querySelectorAll('.word')],positions=['29%','50%','71%'];
let score=0,coins=0,lives=10,level=1,combo=0,best=readBest(),lane=1,target=null,locked=false,carColor=0,roadIndex=0,wordSpeed=1.15,collisionArmed=true,motionOn=false,lastTilt=0,audioCtx=null,engineGain=null,boost=0,stars=0;
function readBest(){try{return Number(localStorage.getItem('bestCombo'))||0}catch(e){return 0}}function saveBest(){try{localStorage.setItem('bestCombo',String(best))}catch(e){}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}function updateUI(){$('score').textContent=score;$('coins').textContent=coins;$('lives').textContent=lives;$('level').textContent=level;$('combo').textContent=combo;$('best').textContent=best;$('speedFill').style.width=Math.min(100,Math.round((wordSpeed+boost)*32))+'%'}
function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const master=audioCtx.createGain();master.gain.value=.8;master.connect(audioCtx.destination);engineGain=audioCtx.createGain();engineGain.gain.value=.006;engineGain.connect(master);const osc=audioCtx.createOscillator();osc.type='sine';osc.frequency.value=72;osc.connect(engineGain);osc.start()}catch(e){audioCtx=null}}
function tone(freq,duration,type='sine',volume=.055,slide=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration+.03)}
function soundCorrect(){tone(520,.11,'sine',.06,170);setTimeout(()=>tone(820,.18,'sine',.065,220),90)}function soundWrong(){tone(180,.18,'triangle',.045,-80)}function soundBoost(){tone(300,.1,'sine',.05,500);setTimeout(()=>tone(700,.11,'sine',.045,300),80)}function soundMove(){tone(240,.04,'triangle',.018,30)}
function speak(text,times=1){initAudio();if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let n=0;const once=()=>{if(n++>=times)return;const u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=.78;u.pitch=1.25;u.volume=1;u.onend=()=>{if(n<times)setTimeout(once,130)};speechSynthesis.speak(u)};once()}
function introduction(){const text='歡迎來到小小郵差中文字車手！你是一位郵差，要把正確的中文字信件送到學校。請用左右按鈕，或左右傾斜裝置控制郵車；按向上按鈕，或向上傾斜可以加速。撞上正確字卡，就能收集一顆星星。準備好了嗎？';$('modalTitle').textContent='📮 郵差任務';$('result').textContent=text;$('close').textContent='開始送信';$('modal').classList.add('show');speak(text)}
function setRoad(force=false){if(!force&&Math.random()>.3)return;roadIndex=(roadIndex+1)%roads.length;applyRoad()}function applyRoad(){const r=$('road');r.className='road '+roads[roadIndex];wordSpeed=[1.05,1.35,.8,1.7,1.15][roadIndex]+Math.min(level*.035,.65);r.style.setProperty('--road-speed',`${Math.max(.55,1.5-wordSpeed/2)}s`)}
function setWords(){const rest=words.filter(w=>w[0]!==target[0]);const opts=[target,pick(rest),pick(rest)].sort(()=>Math.random()-.5);cards.forEach((c,i)=>{c.textContent=opts[i][0];c.dataset.char=opts[i][0];c.style.left=positions[i];c.style.top=(-80-i*105)+'px';c.classList.remove('hint','correct','wrong');c.dataset.hit='false'})}
function setup(){locked=false;collisionArmed=true;lane=1;boost=0;$('car').classList.remove('fast');$('car').style.left=positions[lane];target=pick(words);$('question').textContent=`郵差任務：把「${target[0]}」信件送到學校！`;setWords();setRoad();updateUI();speak(`找出：${target[0]}`)}
function move(d){if(locked)return;lane=Math.max(0,Math.min(2,lane+d));$('car').style.left=positions[lane];soundMove()}
function accelerate(){if(locked)return;initAudio();boost=Math.min(1.8,boost+.35);$('car').classList.add('fast');soundBoost();clearTimeout(accelerate.timer);accelerate.timer=setTimeout(()=>{boost=Math.max(0,boost-.25);if(boost<=.05){boost=0;$('car').classList.remove('fast')}},600);updateUI()}
function flash(t){const f=$('flash');f.textContent=t;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function hit(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}
function addStar(){stars++;const s=document.createElement('span');s.className='star new';s.textContent='⭐';$('starRack').appendChild(s);setTimeout(()=>s.classList.remove('new'),900)}
function collide(){if(locked||!collisionArmed)return;const cr=$('car').getBoundingClientRect();let selected=null;cards.some(c=>{if(c.dataset.hit!=='true'&&hit(cr,c.getBoundingClientRect())){selected=c;return true}return false});if(!selected)return;selected.dataset.hit='true';collisionArmed=false;if(selected.dataset.char===target[0])correct(selected);else wrong(selected)}
function correct(c){locked=true;c.classList.add('correct');combo++;best=Math.max(best,combo);saveBest();score+=10*level+combo*2;coins++;addStar();flash('送信成功！⭐');soundCorrect();speak(`${target[0]}`);updateUI();setTimeout(()=>{if(level%5===0)mission();else{level++;setup()}},850)}
function wrong(c){c.classList.add('wrong','hint');flash('信件不對！');soundWrong();speak(c.dataset.char,2);setTimeout(()=>{c.classList.remove('wrong','hint');if(lives<=1){lives=0;combo=0;updateUI();end()}else{lives--;combo=0;collisionArmed=true;updateUI()}},700)}
function mission(){locked=true;tone(660,.12);setTimeout(()=>tone(880,.12),130);setTimeout(()=>tone(1100,.2),260);$('modalTitle').textContent='🏫 送信成功！';$('result').textContent=`你已完成第 ${level} 關！郵車收集了 ${stars} 顆星星，得到 ${score} 分。`;$('close').textContent='繼續送信';$('modal').classList.add('show');speak('送信成功！恭喜你！')}
function end(){locked=true;soundWrong();$('modalTitle').textContent='🏁 郵車休息時間';$('result').textContent=`今天完成 ${score} 分，收集 ${stars} 顆星星。`;$('close').textContent='再玩一次';$('modal').classList.add('show');speak('遊戲結束，謝謝你完成送信任務！')}
function reset(){initAudio();score=0;coins=0;lives=10;level=1;combo=0;stars=0;$('starRack').innerHTML='';roadIndex=0;applyRoad();$('menu').classList.remove('show');setup()}
function closeModal(){const intro=$('modalTitle').textContent==='📮 郵差任務',over=lives===0;$('modal').classList.remove('show');if(intro)setup();else if(over)reset();else{level++;setup()}}
function changeCar(){initAudio();carColor=(carColor+1)%cars.length;document.querySelector('.body').style.background=cars[carColor];tone(440,.08)}function changeRoad(){initAudio();roadIndex=(roadIndex+1)%roads.length;applyRoad();tone(330,.08)}
function moveWords(){if(!locked){const speed=wordSpeed+boost;cards.forEach((c,i)=>{let y=parseFloat(c.style.top)||-80;y+=speed;if(y>760){y=-90-i*100;c.style.left=positions[Math.floor(Math.random()*3)];c.dataset.hit='false'}c.style.top=y+'px'});collide()}requestAnimationFrame(moveWords)}
async function enableMotion(){initAudio();if(motionOn)return;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw new Error()}catch(e){$('motionStatus').textContent='Motion Control：需要允許感應器';return}}window.addEventListener('deviceorientation',onTilt);motionOn=true;$('motionStatus').textContent='Motion Control：已啟用'}function onTilt(e){if(locked)return;const x=Number(e.gamma)||0,y=Number(e.beta)||0;if(Math.abs(x-lastTilt)>5){if(x>12)move(1);else if(x<-12)move(-1);lastTilt=x}if(y<-8)accelerate()}
$('left').onclick=()=>{initAudio();move(-1)};$('right').onclick=()=>{initAudio();move(1)};$('boost').onclick=accelerate;$('roadBtn').onclick=changeRoad;$('garage').onclick=changeCar;$('restartMenu').onclick=reset;$('close').onclick=closeModal;$('levelButton').onclick=()=>{$('menu').classList.toggle('show');enableMotion()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();initAudio();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();initAudio();move(1)}if(e.key==='ArrowUp'){e.preventDefault();accelerate()}if(e.key==='Enter'&&$('modal').classList.contains('show'))closeModal()});document.addEventListener('pointerdown',()=>{initAudio();enableMotion()},{once:true});setup();moveWords();setTimeout(introduction,350);
</script>
</body>
</html>
